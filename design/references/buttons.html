<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кнопки</title>
<style>
:root{
  --brand-600:#2b46f0; --brand-700:#1c33d4; --brand-100:#e3e9ff; --brand-050:#f2f5ff;
  --ink-900:#0d1326; --ink-700:#232a42; --ink-500:#565e78; --ink-400:#8d93ab;
  --line:#e4e8f4; --line-strong:#c9d2ea; --surface:#f6f8fc;
  --navy-950:#070b1d; --navy-900:#0c1228; --navy-800:#141b38; --navy-line:#26305c; --navy-text:#aab3d6;
  --green:#0aa34f; --green-deep:#087a3c; --amber:#e07c00; --danger:#d92d47;
  --font-sans:Inter,"Segoe UI",Arial,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow-card:0 1px 2px rgba(13,19,38,.04),0 8px 24px -12px rgba(13,19,38,.10);
  --shadow-panel:0 1px 2px rgba(13,19,38,.05),0 24px 48px -20px rgba(13,19,38,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);color:var(--ink-700);background:#fff;padding:28px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.kicker{font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brand-600)}
.note{font-size:12.5px;color:var(--ink-400);margin-top:6px}
h3.sec{font-size:13px;font-weight:600;color:var(--ink-500);margin:26px 0 12px;
  text-transform:uppercase;letter-spacing:.08em}
h3.sec:first-of-type{margin-top:0}

.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  border-radius:10px;padding:12px 26px;font-size:15px;font-weight:600;text-decoration:none;
  transition:all .18s ease;border:1px solid transparent}
.btn.sm{padding:9px 18px;font-size:14px}
.btn-primary{background:var(--brand-600);border-color:var(--brand-600);color:#fff;
  box-shadow:0 8px 20px -8px rgba(43,70,240,.45)}
.btn-primary:hover{background:var(--brand-700);border-color:var(--brand-700);transform:translateY(-1px)}
.btn-ghost{background:#fff;border-color:var(--line-strong);color:var(--ink-700)}
.btn-ghost:hover{border-color:var(--brand-600);color:var(--brand-600)}
.dark{background:var(--navy-950);border-radius:14px;padding:22px}
.btn-dark-ghost{background:transparent;border-color:var(--navy-line);color:#e6eaff}
.btn-dark-ghost:hover{border-color:#5468ff;color:#aab8ff}
.arr{font-weight:400}
</style></head>
<body>
<h3 class="sec">Первичная / вторичная</h3>
<div class="row">
<a class="btn btn-primary" href="#">Обсудить задачу <span class="arr">→</span></a>
<a class="btn btn-ghost" href="#">Смотреть продукты</a>
</div>
<h3 class="sec">Малый размер (шапка)</h3>
<div class="row">
<a class="btn btn-primary sm" href="#">Обсудить задачу</a>
<a class="btn btn-ghost sm" href="#">Документация</a>
</div>
<h3 class="sec">На тёмной поверхности</h3>
<div class="dark row">
<a class="btn btn-primary" href="#">Запросить пилот <span class="arr">→</span></a>
<a class="btn btn-dark-ghost" href="#">Архитектура решения</a>
</div>
<p class="note">Радиус 10px (не пилюля). Hover — тёмный оттенок brand-700 + лёгкий подъём.
Фокус — кольцо rgba(43,70,240,.28).</p>
</body></html>
