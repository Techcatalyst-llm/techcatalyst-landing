<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Формы</title>
<style>
:root{
  --brand-600:#2b46f0; --brand-700:#1c33d4; --brand-100:#e3e9ff; --brand-050:#f2f5ff;
  --ink-900:#0d1326; --ink-700:#232a42; --ink-500:#565e78; --ink-400:#8d93ab;
  --line:#e4e8f4; --line-strong:#c9d2ea; --surface:#f6f8fc;
  --navy-950:#070b1d; --navy-900:#0c1228; --navy-800:#141b38; --navy-line:#26305c; --navy-text:#aab3d6;
  --green:#0aa34f; --green-deep:#087a3c; --amber:#e07c00; --danger:#d92d47;
  --font-sans:Inter,"Segoe UI",Arial,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow-card:0 1px 2px rgba(13,19,38,.04),0 8px 24px -12px rgba(13,19,38,.10);
  --shadow-panel:0 1px 2px rgba(13,19,38,.05),0 24px 48px -20px rgba(13,19,38,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);color:var(--ink-700);background:#fff;padding:28px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.kicker{font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brand-600)}
.note{font-size:12.5px;color:var(--ink-400);margin-top:6px}
h3.sec{font-size:13px;font-weight:600;color:var(--ink-500);margin:26px 0 12px;
  text-transform:uppercase;letter-spacing:.08em}
h3.sec:first-of-type{margin-top:0}

body{background:var(--surface)}
.panel{max-width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:28px;box-shadow:var(--shadow-card)}
h4{font-size:22px;font-weight:650;letter-spacing:-.02em;color:var(--ink-900);margin:10px 0 6px}
label{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--ink-700)}
input,textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line-strong);
  border-radius:10px;padding:11px 13px;font-size:15px;font-family:var(--font-sans);
  color:var(--ink-900);outline:none;transition:border .15s, box-shadow .15s;resize:vertical}
input:focus,textarea:focus{border-color:var(--brand-600);box-shadow:0 0 0 3px rgba(43,70,240,.16)}
::placeholder{color:var(--ink-400)}
.btn{width:100%;margin-top:18px;border:0;border-radius:10px;background:var(--brand-600);
  color:#fff;padding:13px;font-size:15px;font-weight:600;font-family:var(--font-sans);
  cursor:pointer;transition:background .15s}
.btn:hover{background:var(--brand-700)}
.fine{margin-top:12px;font-size:12px;color:var(--ink-400);line-height:1.5}
</style></head>
<body>
<div class="panel">
  <div class="kicker">// Пилотное внедрение</div>
  <h4>Оставьте заявку</h4>
  <label>Рабочая почта<input type="email" placeholder="name@company.ru"></label>
  <label>Компания<input type="text" placeholder="ООО «Компания»"></label>
  <label>Задача<textarea rows="3" placeholder="Коротко опишите контур и задачу"></textarea></label>
  <button class="btn">Отправить заявку</button>
  <p class="fine">Отправляя форму, вы соглашаетесь с политикой конфиденциальности.</p>
</div>
</body></html>
